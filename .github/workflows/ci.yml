name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .                                   # analise estatica
      - run: pytest --cov --cov-fail-under=70               # testes + cobertura minima (RNF17)

  client:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --project-name dsm_conecta --platforms=web,android
      - run: rm -f test/widget_test.dart
      - run: dart tool/preparar_plataformas.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Iteração 5: artefatos das três plataformas, gerados a partir da mesma base de código.
  artefatos-web-android:
    needs: [backend, client]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --project-name dsm_conecta --platforms=web,android
      - run: rm -f test/widget_test.dart
      - run: dart tool/preparar_plataformas.dart
      - run: flutter pub get
      - run: flutter build web --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: dsm-conecta-web, path: app/build/web}
      - uses: actions/upload-artifact@v4
        with: {name: dsm-conecta-apk, path: app/build/app/outputs/flutter-apk/app-release.apk}

  artefato-windows:
    needs: [backend, client]
    runs-on: windows-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --project-name dsm_conecta --platforms=windows
      - run: Remove-Item -ErrorAction SilentlyContinue test/widget_test.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: {name: dsm-conecta-windows, path: app/build/windows/x64/runner/Release}
